[package]
name = "tau-rust-tools"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Stateless native Rust-mode capabilities for Tau"
publish = false

[dependencies]
cargo_toml = "1.0.0"
clap = { version = "4.5.50", features = ["derive"] }
dunce = "1.0.5"
glob = "0.3.4"
proc-macro2 = { version = "1.0.103", features = ["span-locations"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
syn = { version = "2.0.108", features = ["full", "visit"] }
toml = "0.9.8"
walkdir = "2.5.0"

[dev-dependencies]
tempfile = "3.20.0"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
