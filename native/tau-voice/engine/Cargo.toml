[package]
name = "pi-voice"
version = "18.0.10"
edition = "2024"
license = "MIT"
description = "OMP native voice engine, extracted for Tau; see ../LICENSE-OMP"

[dependencies]
audiopus_sys = { version = "=0.2.2", features = ["static"] }
bytes = "=1.12.1"
flume = "=0.11.1"
opus = "=0.3.1"
parking_lot = "=0.12.5"
tokio = { version = "=1.53.1", features = ["full"] }
webrtc = "=0.17.2"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "=0.2.189"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Media_Audio", "Win32_Media_Multimedia", "Win32_System_Com", "Win32_System_Threading", "Win32_Security"] }
